[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rag-evaluation-platform"
version = "0.1.0"
description = "Enterprise RAG platform with LLM evaluation, monitoring, and MLflow tracking."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ML Platform Engineering" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.35",
    "transformers>=4.42",
    "torch>=2.3",
    "faiss-cpu>=1.8",
    "pypdf>=4.2",
    "pandas>=2.2",
    "streamlit>=1.36",
    "mlflow>=2.14",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "dashboard*", "embeddings*", "evaluation*", "ingestion*", "monitoring*", "rag_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
