services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://rag:rag@postgres:5432/rag_platform
      --default-artifact-root /mlruns
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@postgres:5432/rag_platform
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@postgres:5432/rag_platform
      MLFLOW_TRACKING_URI: http://mlflow:5000
      VECTOR_INDEX_PATH: /app/artifacts/vector_index
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env.example
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  mlflow-artifacts:
